<html>
  <head>
    <title>Práctica 6 IG - Alba Ramos Quintana</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="panel-superior">
      <div class="botones-fila">
        <div id="selector-hud" class="btn-espacial" style="display: flex; align-items: center; gap: 10px;">
          <button id="btnAnterior" style="background:transparent; border:none; color:#00f0ff; cursor:pointer;">◀</button>
          <span id="nombreAstroSlider" style="color: #00f0ff; font-weight: bold; min-width: 90px; text-align: center;"></span>
          <button id="btnSiguiente" style="background:transparent; border:none; color:#00f0ff; cursor:pointer;">▶</button>
          <button id="btnVerInfoSlider" class="btn-espacial" style="padding: 2px 8px; font-size: 11px; margin-left: 5px;">Ver Info</button>
        </div>
        
        <button type="button" class="btn-espacial" id="btnOrbitas">Órbitas</button>

        <button type="button" class="btn-espacial" id="btnConstelaciones" title="Activar Constelaciones" style="font-size: 16px; color: #ffd700; padding: 6px 12px;">★</button>

      </div>
      
      <select id="selectorCamara" class="btn-espacial select-camara">
        <option value="orbitar">Vista Orbital</option>
        <option value="pilotar">Pilotar Nave</option>
      </select>
    </div>

    <div id="panel-creador">
      <div id="herramientas-creador" style="display: flex; flex-direction: column; gap: 8px; background: rgba(8, 12, 25, 0.9); padding: 15px; border: 1px solid #ff00ff; border-radius: 8px;">
        
        <select id="selectorHerramientas" class="btn-espacial select-creador">
          <option value="" disabled selected hidden>MODO CREADOR</option>
          <option value="añadir">+ Crear Astro</option>
          <option value="borrar">Borrar Seleccionado</option>
        </select>
        
        <div id="panel-analisis" style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px; font-size: 13px; color: #ddd; display: none;">
          <div style="color: #ff00ff; font-weight: bold; margin-bottom: 5px;">ANÁLISIS</div>
          <div>Distancia al Sol: <strong id="exo-dist">--</strong></div>
          <div>Clima: <strong id="exo-clima">--</strong></div>
          <div>Habitabilidad: <strong id="exo-hab">--</strong></div>
        </div>
      </div>
    </div>

    <div id="hud-controles">
      <label for="sliderVelocidad">
        Acelerador Temporal: <span id="valorVelocidad" style="color:#00f0ff; font-weight:bold;">Tiempo Real</span>
        <button id="btnReset" title="Volver a Tiempo Real" style="display: none;">↺</button>
      </label>
      <input type="range" id="sliderVelocidad" class="rango-velocidad" min="0" max="0.01" step="0.0001" value="0.0001">
    </div>

    <div id="hud-proximidad" style="display: none;">
      Estás cerca de: <span id="prox-nombre" style="color: #00f0ff;">PLANETA</span>
      <br><span style="font-size: 10px; color: #aaaaaa;">(Pulsa la barra ESPACIADORA para analizar)</span>
    </div>

    <div id="panel-info" style="display: none;">
      <h2 id="info-titulo" style="margin-top: 0; color: #00f0ff; text-transform: uppercase;">PLANETA</h2>
      <div id="info-desc" style="font-size: 14px; line-height: 1.5; text-align: left;">
 
      </div>
      <button id="btnCerrarInfo" class="btn-espacial" style="margin-top: 20px; width: 100%;">Cerrar</button>
    </div>

    <div id="toast-controles" class="toast-controles">
      <h3 id="toast-titulo">MODO</h3>
      <p id="toast-desc">Controles</p>
    </div>    

    <script src="main.js" type="module"></script>
  </body>
</html>
